provider: University of Birmingham
providerId: university-of-birmingham
description: >-
  Versioning and deprecation posture across the surfaces the University of Birmingham operates.
  Recorded honestly: the institution publishes no API versioning policy, no deprecation policy, no
  changelog and no status page for any of these surfaces, and none of them advertise RFC 8594
  Deprecation or Sunset headers. Where a version exists it comes from the protocol or the software,
  not from an institutional decision.
versioning:
  scheme: none-institutional
  detail: >-
    There is no University-wide API versioning scheme because there is no University-wide API
    programme. Each surface inherits versioning from the protocol or product beneath it.
  by_surface:
    - surface: UBIRA eData / eTheses / ePapers OAI-PMH
      scheme: protocol
      current: 'OAI-PMH 2.0'
      detail: >-
        protocolVersion 2.0 is returned by every Identify response. Metadata formats are versioned by
        prefix (oai_dc, didl, rdf). The repository software is EPrints; no EPrints release version is
        advertised on the public surface.
      evidence: https://edata.bham.ac.uk/cgi/oai2?verb=Identify
    - surface: BEAR GitLab REST API
      scheme: uri-path
      current: v4
      detail: >-
        GitLab's own /api/v4 path versioning. The instance version is not readable without a token —
        /api/v4/version returns 401 — so the deployed GitLab release cannot be confirmed from
        outside.
      evidence: https://gitlab.bham.ac.uk/api/v4/projects?per_page=1
    - surface: English Constructicon API
      scheme: unversioned
      current: null
      detail: >-
        No version segment in the path, no version header, no version field in the payload. The
        OpenAPI in this repository declares info.version 1.0.0, but that number was assigned by API
        Evangelist when the description was written and is not published by the project.
      evidence: https://englishconstructicon.bham.ac.uk/database/api/constructions
    - surface: SAML identity provider
      scheme: protocol
      current: 'SAML 2.0'
      detail: >-
        SAML 2.0 with the SAML 1.x Shibboleth AuthnRequest profile still declared alongside it. The
        metadata's own comments record the deployment history — built on Shibboleth IdP v3.2.1 in
        June 2016, upgraded from a v2 production service, with the entityID changed at that point
        from https://shibbolethidp2.bham.ac.uk/idp/shibboleth to https://idp.bham.ac.uk/shibboleth.
        That is the only versioned change history published for any surface here, and it is in an XML
        comment.
      evidence: https://idp2.bham.ac.uk/idp/shibboleth
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  detail: >-
    No deprecation policy is published for any surface. No Sunset or Deprecation response header was
    observed on any probed endpoint. No surface carries a changelog or release-notes page.
  observed_deprecations:
    - item: 'SAML 1.x bindings on the identity provider'
      status: still-declared
      detail: >-
        The IdP still declares urn:mace:shibboleth:1.0:profiles:AuthnRequest and SAML 1.0
        ArtifactResolutionService endpoints. Declared, not deprecated — no sunset is announced.
support:
  status_page: null
  changelog: null
  detail: >-
    No status page and no changelog were found for any of these surfaces. Repository contact is by
    mailing list — research-data@contacts.bham.ac.uk for eData, ubira@lists.bham.ac.uk for eTheses
    and ePapers, both taken from the OAI-PMH Identify adminEmail. The Constructicon API's only
    contact is the project lead's address in the OpenAPI, f.b.perek@bham.ac.uk, taken from the
    project's own API documentation page.
