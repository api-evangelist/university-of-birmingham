# authorship: generated by API Evangelist from this repository's own artifacts and live probes.
# NOT a controlled vocabulary published by the University of Birmingham.
# x-method: derived
# x-source-url: openapi/university-of-birmingham-constructions-api-openapi.yml
# generated: 2026-08-30
vocabulary:
  name: University of Birmingham API Vocabulary
  description: >-
    Controlled vocabulary for the machine-readable interfaces cataloged for the
    University of Birmingham, covering the English Constructicon construction
    grammar API and the EPrints-based OAI-PMH research repositories.
  version: 1.0.0
  terms:
    - term: Construction
      definition: >-
        A form-meaning pairing recorded in the English Constructicon database,
        the primary object returned by the /constructions endpoint.
      tags: [ Linguistics, Construction Grammar, Object ]
    - term: construction_id
      definition: Human-readable code identifying a construction, e.g. Vthat0.
      tags: [ Identifier, Field ]
    - term: form
      definition: Syntactic form template of a construction, e.g. "NP Verb (that) Clause".
      tags: [ Linguistics, Field ]
    - term: meaning
      definition: Semantic description of what a construction expresses.
      tags: [ Linguistics, Field ]
    - term: pattern
      definition: Short surface pattern label for a construction; may be null.
      tags: [ Linguistics, Field ]
    - term: OAI-PMH
      definition: >-
        Open Archives Initiative Protocol for Metadata Harvesting, the XML-based
        protocol exposed by the UBIRA eData, eTheses and ePapers EPrints
        repositories for harvesting Dublin Core metadata.
      tags: [ Protocol, Repository, Metadata ]
    - term: EPrints
      definition: >-
        Open-source repository software (version 3.4.0) running the University's
        research-output repositories.
      tags: [ Repository, Software ]
    - term: Dublin Core
      definition: >-
        The default metadata schema returned by the OAI-PMH endpoints for
        archived datasets, theses and working papers.
      tags: [ Metadata, Standard ]
    - term: UBIRA
      definition: >-
        University of Birmingham Institutional Research Archive — the umbrella name
        for the eData (research data) and eTheses repositories. The repository
        contact address for eTheses and ePapers is ubira@lists.bham.ac.uk, taken
        from the OAI-PMH Identify adminEmail.
      tags: [ Repository, Institution ]
    - term: BEAR
      definition: >-
        Birmingham Environment for Academic Research — the University's research
        computing estate. The self-hosted GitLab at gitlab.bham.ac.uk resolves
        through proxy-vrrp-1.bear.bham.ac.uk into this estate.
      tags: [ Research Computing, Infrastructure ]
    - term: entityID
      definition: >-
        The SAML identifier of the University's identity provider,
        https://idp.bham.ac.uk/shibboleth. It is an identifier, not a fetchable
        endpoint; the metadata is served from https://idp2.bham.ac.uk/idp/shibboleth.
      tags: [ Identity, SAML, Identifier ]
    - term: shibmd:Scope
      definition: >-
        The attribute-scope assertion in the identity provider's federation metadata.
        The University asserts the single scope bham.ac.uk.
      tags: [ Identity, Shibboleth, Field ]
    - term: UK Access Management Federation
      definition: >-
        The UK national identity federation whose metadata aggregate carries the
        University's identity provider entry with OrganizationName
        "University of Birmingham".
      tags: [ Identity Federation, Standard ]
    - term: DataCite prefix 10.25500
      definition: >-
        The DOI prefix under which UBIRA eData mints identifiers, resolving to the
        DataCite repository client bl.bham, "University of Birmingham - eData",
        registered 2017.
      tags: [ Identifier, DataCite, Research Data ]
    - term: x-operator
      definition: >-
        The operator axis this profile records on every surface. `institution` means
        the University runs the thing the surface describes; `tenant` means the
        University is a customer on a vendor platform (Elsevier Pure, Ex Libris Primo,
        Instructure Canvas) — its data, the vendor's contract.
      tags: [ Provenance, Governance ]
