specification: API Evangelist Conformance
specificationVersion: '0.1'
provider: University of Birmingham
providerId: university-of-birmingham
generated: '2026-08-30'
method: probed
authorship: generated by API Evangelist from live probes; not authored by the institution.
source: live HTTP probes of birmingham.ac.uk and bham.ac.uk hosts, the UK Access Management Federation
  metadata aggregate, and the DataCite REST API, on 2026-08-30
regime: education
description: >-
  Domain-standard conformance for the University of Birmingham against the Kin Score `education`
  regime, established by probing live endpoints rather than by reading a prose claim. Each hit names
  the exact location that returned the evidence, the operator of the endpoint, and the HTTP status
  observed on 2026-08-30. Standards in the regime that were probed and NOT found are recorded under
  `absent` so the gaps are legible and are never mistaken for unchecked. Conformance is claimed for
  the institution only where the institution operates the endpoint; where a standard is implemented
  by a vendor platform Birmingham is a tenant on, that is said plainly and is not claimed.
standards:
  - standard: oai-pmh
    status: conformant
    x-operator: institution
    detail: >-
      Three EPrints repositories on the University's own bham.ac.uk hosts expose OAI-PMH 2.0
      providers, all answering unauthenticated. UBIRA eData (research data) returns repositoryName
      "UBIRA eData", protocolVersion 2.0 and adminEmail research-data@contacts.bham.ac.uk, and
      ListMetadataFormats offers oai_dc, didl and rdf. UBIRA ETheses returns adminEmail
      ubira@lists.bham.ac.uk and earliestDatestamp 2019-01-17T14:07:29Z. ePapers Repository returns
      the same adminEmail and earliestDatestamp 2012-12-07T12:28:00Z. edata.bham.ac.uk resolves to
      147.188.217.239, University of Birmingham address space.
    evidence:
      - url: https://edata.bham.ac.uk/cgi/oai2?verb=Identify
        status: 200
        note: 'text/xml — repositoryName "UBIRA eData", protocolVersion 2.0, adminEmail research-data@contacts.bham.ac.uk'
      - url: https://edata.bham.ac.uk/cgi/oai2?verb=ListMetadataFormats
        status: 200
        note: 'metadataPrefix didl, oai_dc, rdf'
      - url: https://etheses.bham.ac.uk/cgi/oai2?verb=Identify
        status: 200
        note: 'repositoryName "UBIRA ETheses", earliestDatestamp 2019-01-17T14:07:29Z'
      - url: https://epapers.bham.ac.uk/cgi/oai2?verb=Identify
        status: 200
        note: 'repositoryName "ePapers Repository", earliestDatestamp 2012-12-07T12:28:00Z'
    caveat: >-
      The three repositories each advertise an http:// baseURL for themselves in their Identify
      response (for example http://edata.bham.ac.uk/cgi/oai2) while serving over https. Harvesters
      that trust the advertised baseURL will be redirected; this is reported as a defect, not as a
      conformance failure.
  - standard: saml
    status: conformant
    x-operator: institution
    detail: >-
      The University operates its own SAML 2.0 Identity Provider. The entity descriptor is served
      directly by IT Services at idp2.bham.ac.uk and carries their own build/maintenance history in
      XML comments. It declares SingleSignOnService endpoints for
      urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST, HTTP-Redirect and HTTP-POST-SimpleSign, an
      AttributeService over SOAP, ArtifactResolutionService for SAML 1.0 and 2.0, and
      SingleLogoutService over four bindings. entityID is https://idp.bham.ac.uk/shibboleth.
    evidence:
      - url: https://idp2.bham.ac.uk/idp/shibboleth
        status: 200
        note: 'application/xml, 14,929 bytes — SAML 2.0 EntityDescriptor, entityID https://idp.bham.ac.uk/shibboleth, IDPSSODescriptor present'
  - standard: shibboleth
    status: conformant
    x-operator: institution
    detail: >-
      The IdP is a Shibboleth deployment (Shibboleth IdP v3, per the metadata's own upgrade notes)
      registered in the UK Access Management Federation. Its entry in the federation aggregate
      carries OrganizationName and mdui:DisplayName "University of Birmingham" and shibmd:Scope
      bham.ac.uk, and the aggregate also holds a development IdP,
      https://idpdev.bham.ac.uk/idp/shibboleth. The Shibboleth 1.0 AuthnRequest profile
      (urn:mace:shibboleth:1.0:profiles:AuthnRequest) is declared alongside the SAML 2 bindings.
    evidence:
      - url: http://metadata.ukfederation.org.uk/ukfederation-metadata.xml
        status: 200
        note: '87.9 MB aggregate; contains entityID https://idp.bham.ac.uk/shibboleth with OrganizationName "University of Birmingham" and shibmd:Scope bham.ac.uk'
      - url: https://idp2.bham.ac.uk/idp/shibboleth
        status: 200
        note: 'declares urn:mace:shibboleth:1.0:profiles:AuthnRequest at /idp/profile/Shibboleth/SSO'
  - standard: datacite
    status: conformant
    x-operator: institution
    detail: >-
      UBIRA eData mints DOIs under the DOI prefix 10.25500, which the DataCite REST API resolves to
      the DataCite repository client `bl.bham`, named "University of Birmingham - eData", registered
      in 2017 through the British Library consortium. Records harvested from the eData OAI-PMH
      provider carry doi.org/10.25500/... identifiers. The prefix and the repository client are the
      institution's.
    evidence:
      - url: https://api.datacite.org/prefixes/10.25500
        status: 200
        note: 'relationships.clients -> bl.bham'
      - url: https://api.datacite.org/clients/bl.bham
        status: 200
        note: 'name "University of Birmingham - eData", year 2017'
      - url: 'https://edata.bham.ac.uk/cgi/oai2?verb=ListRecords&metadataPrefix=oai_dc'
        status: 200
        note: 'records carry https://doi.org/10.25500/... identifiers'
absent:
  - standard: scim
    detail: No SCIM endpoint was found on any birmingham.ac.uk or bham.ac.uk host. Identity provisioning
      is not publicly exposed.
  - standard: lti
    detail: >-
      canvas.bham.ac.uk is a live Instructure Canvas tenancy (CNAME birmingham-vanity.instructure.com)
      and Canvas is an LTI platform, but that is Instructure's implementation running under a
      Birmingham vanity hostname, and no LTI platform configuration is publicly readable. Not claimed
      for the institution.
    evidence:
      - url: https://canvas.bham.ac.uk/
        status: 200
        note: 'Instructure Canvas tenancy — vendor implementation, tenant relationship only'
  - standard: oneroster
    detail: Not found.
  - standard: ed-fi
    detail: Not found. Ed-Fi is a US K-12 standard and is out of scope for a UK university.
  - standard: caliper
    detail: Not found.
  - standard: qti
    detail: Not found.
  - standard: orcid
    detail: >-
      Birmingham author records carry ORCID iDs inside the Elsevier Pure portal at
      research.birmingham.ac.uk, but that is Pure's ORCID integration on Elsevier's platform, not a
      Birmingham-operated ORCID client. The EPrints repositories do not expose an ORCID interface.
      Not claimed for the institution.
  - standard: crossref
    detail: >-
      No Birmingham-operated Crossref member endpoint or deposit interface was found. Journal DOIs
      appearing in repository records are minted by publishers, not by the University.
