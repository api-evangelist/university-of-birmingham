- aid: university-of-birmingham:identity-provider
  name: University of Birmingham Identity Provider (SAML 2.0 / Shibboleth)
  x-operator: institution
  description: >-
    The University's own Shibboleth SAML 2.0 Identity Provider. The entity descriptor is served
    directly by IT Services and carries their maintenance history in XML comments; it declares
    SingleSignOnService endpoints for HTTP-POST, HTTP-Redirect, POST-SimpleSign and the SAML 1.x
    Shibboleth AuthnRequest profile, SingleLogoutService and an AttributeService over SOAP. The
    entityID https://idp.bham.ac.uk/shibboleth is registered in the UK Access Management Federation
    aggregate with OrganizationName "University of Birmingham" and shibmd:Scope bham.ac.uk. This is
    federated institutional single sign-on, not a self-serve developer credential — there is no way
    for an unaffiliated caller to obtain access through it.
  humanURL: https://idp2.bham.ac.uk/idp/shibboleth
