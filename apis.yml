x-coverage:
  state: covered
  reason: covered
  detail: >-
    The University of Birmingham operates no developer portal, no API programme and no API key
    issuance, and a subdomain sweep across both of its registrable domains (birmingham.ac.uk and
    bham.ac.uk) returned DNS for only one candidate — gitlab.bham.ac.uk — with api., data.,
    developer., opendata., open., dev., portal., sandbox. and git. all failing to resolve. What it
    does operate was found by probing rather than by link presence: three EPrints repositories with
    live OAI-PMH 2.0 providers and EPrints REST interfaces, a Shibboleth SAML 2.0 identity provider
    registered in the UK Access Management Federation, a self-hosted GitLab on the BEAR estate whose
    /api/v4/projects answers keyless while its entire web UI sits behind /users/sign_in, and the English Constructicon open research API. Three vendor
    tenancies carrying the University's name — Elsevier Pure at research.birmingham.ac.uk, Ex Libris
    Primo at findit.bham.ac.uk and Instructure Canvas at canvas.bham.ac.uk — were resolved by CNAME
    and are recorded as tenancies, not as Birmingham surfaces. No vendor contract is saved in this
    repository. The single OpenAPI here describes the Constructicon API and was written by API
    Evangelist from the project's documentation and live responses; the University publishes no
    machine-readable API description of its own. Its GitHub organisation exists and is public but
    holds zero public repositories.
