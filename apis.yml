name: University of Birmingham
x-type: university
x-category: Public Research University
description: >-
  The University of Birmingham is a public research university in Birmingham, United Kingdom, a
  founding member of the Russell Group and of the Universitas 21 network. It operates no central
  developer portal, publishes no API programme, issues no API keys, and a subdomain sweep of
  birmingham.ac.uk and bham.ac.uk found nothing at api., data., developer., opendata., open., dev.,
  portal. or git. The programmable footprint it does have is real but decentralised and departmental,
  and it sits on the institution's second registrable domain, bham.ac.uk: three EPrints repositories
  (UBIRA eData, UBIRA eTheses and ePapers) each exposing an OAI-PMH 2.0 provider plus an EPrints REST
  interface; a Shibboleth SAML 2.0 identity provider registered in the UK Access Management
  Federation; a self-hosted GitLab on the BEAR research-computing estate whose /api/v4 project
  listing answers keyless; and one small open research API from the English Constructicon
  construction-grammar project in the College of Arts and Law — the only surface here with an OpenAPI
  description, and that description is ours, not theirs. Three further surfaces that carry the
  University's name are vendor platforms the institution is a tenant on, recorded as tenancies and
  not as Birmingham engineering: an Elsevier Pure research portal, an Ex Libris Primo library
  discovery layer, and an Instructure Canvas VLE.
